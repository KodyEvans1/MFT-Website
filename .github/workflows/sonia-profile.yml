name: Sonia profile review
on:
  pull_request:
    paths:
      - 'content/**'
      - 'src/**'
      - 'scripts/prepare-analytics.js'
      - 'tests/booking-handoff-browser.py'
      - 'tests/sonia-profile*'
      - 'tests/fixtures/other-clinician-prose.json'
      - '.github/workflows/sonia-profile.yml'
  push:
    branches: [main]
    paths:
      - 'content/sonia-profile.json'
      - 'content/simplepractice-booking.json'
      - 'src/assets/mft-analytics.js'
      - 'scripts/prepare-analytics.js'
      - 'tests/booking-handoff-browser.py'
      - 'tests/sonia-profile*'
      - '.github/workflows/sonia-profile.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run verify:publication
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Sonia profile candidate in installed Chrome
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node tests/sonia-profile-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - name: Build the production consent UI for handoff verification
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
          OPS_HANDOFF_COLLECTION_ENABLED: 'true'
      - name: Verify real SimplePractice navigation in installed Chrome without appointments
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python tests/booking-handoff-browser.py
        env:
          MFT_BROWSER: chromium
          MFT_CANDIDATE_ORIGIN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          MFT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.mft.care' || '' }}
      - name: Verify published Sonia content and redirects
        if: github.ref == 'refs/heads/main'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node tests/sonia-profile-browser.cjs
        env:
          SONIA_BASE_URL: https://www.mft.care
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonia-profile-review
          path: |
            tmp/sonia-profile/
            tmp/sonia-profile-live/
            tmp/booking-handoff/
            dist/sonia-hassan-bio/
            reports/SONIA-PROFILE-REVIEW.md
          retention-days: 7
  webkit-handoff:
    name: WebKit scheduling handoff
    # Playwright 1.57 supports this explicit dependency baseline. Keep WebKit a
    # required separately reported gate; an installation error remains a failure.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the production consent UI for handoff verification
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
          OPS_HANDOFF_COLLECTION_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - name: Install the supported WebKit browser and dependencies
        run: python -m playwright install --with-deps webkit
      - name: Verify desktop and mobile handoff in WebKit without appointments
        run: python tests/booking-handoff-browser.py
        env:
          MFT_BROWSER: webkit
          MFT_CANDIDATE_ORIGIN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          MFT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.mft.care' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonia-webkit-handoff
          path: tmp/booking-handoff/
          retention-days: 7
