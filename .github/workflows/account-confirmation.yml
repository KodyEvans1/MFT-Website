name: Verify new-client account confirmation
on:
  pull_request:
    paths:
      - 'src/assets/mft-booking.js'
      - 'src/assets/mft-analytics.js'
      - 'src/assets/start-page.css'
      - 'src/assets/site-experience.js'
      - 'src/booking-*.js'
      - 'src/site-experience.js'
      - 'scripts/prepare-analytics.js'
      - 'content/simplepractice-booking.json'
      - 'tests/account-confirmation-browser.py'
      - 'tests/scheduling_confirmation_fixture.py'
      - 'tests/scheduling-browser-harness.py'
      - '.github/workflows/account-confirmation.yml'
  push:
    branches: [main]
    paths:
      - 'src/assets/mft-booking.js'
      - 'src/assets/mft-analytics.js'
      - 'src/assets/start-page.css'
      - 'src/assets/site-experience.js'
      - 'src/booking-*.js'
      - 'src/site-experience.js'
      - 'scripts/prepare-analytics.js'
      - 'content/simplepractice-booking.json'
      - 'tests/account-confirmation-browser.py'
      - 'tests/scheduling_confirmation_fixture.py'
      - 'tests/scheduling-browser-harness.py'
      - '.github/workflows/account-confirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build a production-origin candidate without deployment
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
          OPS_HANDOFF_COLLECTION_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - name: Verify the isolated confirmation flow and unchanged publication baseline
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python tests/account-confirmation-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-confirmation-verification
          path: |
            tmp/account-confirmation/
            dist/reports/analytics-integration.json
            dist/reports/marketing-review.json
            dist/reports/publication.json
          retention-days: 7
