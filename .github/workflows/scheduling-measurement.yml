name: Verify scheduling measurement
on:
  push:
    branches: [main, review/scheduling-measurement-20261025]
    paths:
      - 'src/assets/mft-analytics.js'
      - 'src/assets/mft-ga4-frame*'
      - 'src/assets/mft-booking.js'
      - 'tests/scheduling-*'
      - 'tests/analytics.test.js'
      - '.github/workflows/scheduling-measurement.yml'
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - name: Build production-origin candidate without deploying
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Trace synthetic callback and navigation order
        run: python tests/scheduling-transport-probe.py
      - name: Publish synthetic-only trace diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tmp/scheduling-measurement/transport-probe.json')
          if p.exists():
              data = json.loads(p.read_text())
              value = json.dumps(data, separators=(',', ':'))
              print('::warning file=tests/scheduling-transport-probe.py,line=1,title=Synthetic transport trace::' + value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          else:
              print('::error file=tests/scheduling-transport-probe.py,line=1::Expected synthetic transport trace missing')
          PY
      - name: Real Google script with intercepted collector and scheduler
        run: python tests/scheduling-measurement-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-transport-diagnostics
          path: tmp/scheduling-measurement/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-measurement-verification
          path: dist/reports/analytics-integration.json
          retention-days: 7
