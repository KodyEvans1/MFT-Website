name: Finalize attribution evidence and generated files

on:
  push:
    branches: [codex/attribution-closeout-2026-11-25]
    paths: ['.github/workflows/attribution-closeout.yml']

permissions:
  contents: read

jobs:
  synchronize-generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/attribution-closeout-2026-11-25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and regenerate the review-safe artifact
        env:
          CONTEXT: local
          SITE_INDEXING_ENABLED: 'false'
          GA4_BASIC_MEASUREMENT_ENABLED: 'false'
          OPS_HANDOFF_COLLECTION_ENABLED: 'false'
        run: |
          npm run check
          npm run verify:publication
          npm run build
      - name: Commit only generated output to this closeout branch
        run: |
          git add -- dist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh generated site artifacts after the verified attribution release'
          git push origin HEAD:codex/attribution-closeout-2026-11-25

  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact public main release without creating events
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          BASE='https://www.mft.care'
          OUT=pathlib.Path('tmp/attribution-closeout'); OUT.mkdir(parents=True,exist_ok=True)
          expected=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}',expected)
          class SameOrigin(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  assert urlsplit(newurl).scheme=='https' and urlsplit(newurl).netloc=='www.mft.care', 'Unexpected redirect origin'
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SameOrigin)
          def read(path):
              req=urllib.request.Request(BASE+path,headers={'Cache-Control':'no-cache','User-Agent':'MFT-attribution-release-verification'})
              with opener.open(req,timeout=30) as r:
                  assert r.status==200
                  body=r.read(2_000_001); assert len(body)<=2_000_000
                  return body,{k.lower():v for k,v in r.headers.items()}
          manifest=None
          for attempt in range(20):
              raw,headers=read('/reports/release-provenance.json')
              candidate=json.loads(raw)
              if candidate['source']['commit']==expected:
                  manifest=candidate;break
              print(json.dumps({'waitingForCommit':expected,'observed':candidate['source']['commit'],'attempt':attempt+1}),flush=True)
              time.sleep(15)
          assert manifest is not None, 'Production has not published the expected main commit'
          assert manifest['source']['providerDeclaredCommit']==expected
          assert manifest['source']['localGit']['head']==expected and manifest['source']['localGit']['state']=='clean'
          assert manifest['source']['providerCommitMatchesLocalHead'] is True
          env=manifest['environment']; policy=manifest['googleMeasurement']
          assert env['productionContext'] is True and env['indexingEnabled'] is True
          assert env['ga4Enabled'] is False and env['ga4RequestedByEnvironment'] is False
          assert env['firstPartyControllerEnabled'] is True and env['opsHandoffEnabled'] is True
          assert policy['mode']=='disabled' and policy['status']=='blocked-sensitive-context'
          assert policy['approvedRoutes']==0 and policy['approvedEvents']==0
          assert manifest['baseline']['firstPartyControllerPages']==60 and manifest['baseline']['opsHandoffPages']==60
          assert manifest['baseline']['sitemapUrls']==63
          (OUT/'release-provenance.json').write_bytes(raw)
          checked=[]
          for asset,source in [('assets/mft-booking.js','src/assets/mft-booking.js'),('assets/mft-analytics.js','src/assets/mft-analytics.js')]:
              body,asset_headers=read('/'+asset)
              digest=hashlib.sha256(body).hexdigest()
              assert digest==manifest['artifacts'][asset]['sha256']
              assert len(body)==manifest['artifacts'][asset]['bytes']
              assert digest==hashlib.sha256(pathlib.Path(source).read_bytes()).hexdigest()
              checked.append({'asset':asset,'sha256':digest,'bytes':len(body),'matchesMainSource':True})
          class Scripts(HTMLParser):
              def __init__(self):super().__init__();self.rows=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':self.rows.append(dict(attrs))
          html,homepage_headers=read('/')
          assert hashlib.sha256(html).hexdigest()==manifest['artifacts']['index.html']['sha256']
          parser=Scripts();parser.feed(html.decode())
          sources=[x['src'] for x in parser.rows if x.get('src')]
          assert any(urlsplit(x).path.endswith('/mft-booking.js') for x in sources)
          assert any(urlsplit(x).path.endswith('/mft-analytics.js') for x in sources)
          assert not any('googletagmanager.com' in x or 'google-analytics.com' in x or 'mft-google-measurement.js' in x for x in sources)
          assert any(x.get('data-mft-handoff-endpoint')=='https://ops.mft.care/api/marketing/attribution' for x in parser.rows)
          final_raw,_=read('/reports/release-provenance.json')
          assert final_raw==raw, 'Release changed while verifying its assets'
          result={'passed':True,'scope':'Read-only public HTTP GETs; no browser script execution, scheduling activation, Ops POST, paid-ad click or Google event. Earlier source-bound browser evidence remains separate.',
                  'expectedMainCommit':expected,'productionCommit':manifest['source']['commit'],'deploymentId':manifest['netlify']['deployId'],
                  'builtAtUtc':manifest['builtAtUtc'],'manifestSha256':hashlib.sha256(raw).hexdigest(),
                  'manifestUnchangedBeforeAfter':True,'sourceAssets':checked,'homepageArtifactMatches':True,
                  'homepageGoogleRuntimeScripts':0,'homepageOpsControllerPresent':True,
                  'contentSecurityPolicy':homepage_headers.get('content-security-policy'),
                  'googleMeasurement':policy,'baseline':manifest['baseline'],'environment':env}
          (OUT/'verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-public-release-evidence
          path: tmp/attribution-closeout/
          retention-days: 30
