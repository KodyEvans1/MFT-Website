name: Verify scheduling measurement
on:
  push:
    branches: [main, review/scheduling-measurement-20261025]
    paths:
      - 'src/assets/mft-analytics.js'
      - 'src/assets/mft-ga4-frame*'
      - 'src/assets/mft-booking.js'
      - 'tests/scheduling-measurement*'
      - 'tests/analytics.test.js'
      - '.github/workflows/scheduling-measurement.yml'
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - name: Build production-origin candidate without deploying
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real Google script with intercepted collector and scheduler
        run: python tests/scheduling-measurement-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-measurement-verification
          path: |
            tmp/scheduling-measurement/
            dist/reports/analytics-integration.json
          retention-days: 7
