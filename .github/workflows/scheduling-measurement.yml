name: Verify scheduling measurement
on:
  pull_request:
    paths:
      - 'src/assets/mft-analytics.js'
      - 'src/assets/mft-ga4-frame*'
      - 'src/assets/mft-booking.js'
      - 'src/booking-*.js'
      - 'src/marketing-improvements.js'
      - 'tests/scheduling-measurement*'
      - 'tests/scheduling-transport-probe.py'
      - 'tests/scheduling-browser-harness.py'
      - 'tests/scheduling-browser-harness.test.py'
      - 'tests/fixtures/scheduling-transport-probe.js'
      - 'tests/fixtures/scheduling-network-probe.js'
      - '.github/workflows/scheduling-measurement.yml'
  push:
    branches: [main]
    paths:
      - 'src/assets/mft-analytics.js'
      - 'src/assets/mft-ga4-frame*'
      - 'src/assets/mft-booking.js'
      - 'src/booking-*.js'
      - 'tests/scheduling-measurement*'
      - 'tests/scheduling-browser-harness.py'
      - 'tests/scheduling-browser-harness.test.py'
      - '.github/workflows/scheduling-measurement.yml'
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - name: Validate the transport diagnostic before opening a browser
        run: |
          node --check tests/fixtures/scheduling-transport-probe.js
          node --check tests/fixtures/scheduling-network-probe.js
          python -m py_compile tests/scheduling-measurement-browser.py tests/scheduling-transport-probe.py tests/scheduling-browser-harness.py
          python tests/scheduling-browser-harness.test.py
      - name: Build a production-origin candidate without deployment
        id: build
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - name: Trace synthetic transport and navigation order
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python tests/scheduling-transport-probe.py
      - name: Real Google script with intercepted collector and scheduler
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python tests/scheduling-measurement-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-measurement-verification
          path: |
            tmp/scheduling-measurement/
            dist/reports/analytics-integration.json
          retention-days: 7
