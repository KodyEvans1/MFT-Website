[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Owner confirmed the scheduling review and requested the corrected production
# release on 2026-11-19. Rebuild in production; promoted preview assets retain
# their preview restrictions. Draft routes remain excluded by publication policy.
[context.production.environment]
  GA4_BASIC_MEASUREMENT_ENABLED = "true"
  SITE_INDEXING_ENABLED = "true"
  OPS_HANDOFF_COLLECTION_ENABLED = "true"
[context.deploy-preview.environment]
  GA4_BASIC_MEASUREMENT_ENABLED = "false"
  SITE_INDEXING_ENABLED = "false"
  OPS_HANDOFF_COLLECTION_ENABLED = "false"
[context.branch-deploy.environment]
  GA4_BASIC_MEASUREMENT_ENABLED = "false"
  SITE_INDEXING_ENABLED = "false"
  OPS_HANDOFF_COLLECTION_ENABLED = "false"
