name: Sonia profile review
on:
  pull_request:
    paths:
      - 'content/**'
      - 'src/**'
      - 'tests/sonia-profile*'
      - 'tests/fixtures/other-clinician-prose.json'
      - '.github/workflows/sonia-profile.yml'
  push:
    branches: [main]
    paths:
      - 'content/sonia-profile.json'
      - 'content/simplepractice-booking.json'
      - 'tests/sonia-profile*'
      - '.github/workflows/sonia-profile.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run verify:publication
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/sonia-profile-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify real SimplePractice navigation without submitting appointments
        run: python tests/booking-handoff-browser.py
        env:
          MFT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.mft.care' || '' }}
      - name: Verify published Sonia content and redirects
        if: github.ref == 'refs/heads/main'
        run: node tests/sonia-profile-browser.cjs
        env:
          SONIA_BASE_URL: https://www.mft.care
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonia-profile-review
          path: |
            tmp/sonia-profile/
            tmp/sonia-profile-live/
            tmp/booking-handoff/
            dist/sonia-hassan-bio/
            reports/SONIA-PROFILE-REVIEW.md
          retention-days: 7
