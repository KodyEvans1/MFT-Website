name: Homepage visual and interaction review
on:
  push:
    branches: ['review/homepage-visual-refresh-20261013']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/homepage-refresh-browser.py
        env:
          MFT_REQUIRE_IMAGES: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-visual-review
          path: tmp/homepage-refresh-browser/
          retention-days: 7
