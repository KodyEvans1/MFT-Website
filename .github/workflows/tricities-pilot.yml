name: Review Tri-Cities adult telehealth pilot
on:
  push:
    branches: ['review/tricities-adult-pilot-20261105']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/tricities-pilot-browser.py
        env:
          MFT_VERIFY_PUBLIC: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tricities-pilot-review
          path: tmp/tricities-pilot/
          retention-days: 14
