name: Homepage-derived reference pages
on:
  push:
    branches: ['review/site-experience-seo-20260930']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm install -g agent-browser@0.38.2
      - run: agent-browser install --with-deps
      - run: node tests/reference-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-pages-browser
          path: |
            tmp/reference-browser/
            dist/reports/reference-pages.json
          retention-days: 7
