name: Plaud page browser review
on:
  push:
    branches: ['review/site-experience-seo-20260930']
    paths:
      - 'src/**'
      - 'tests/start-page*'
      - '.github/workflows/plaud-page-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm install -g agent-browser@0.38.2
      - run: agent-browser install --with-deps
      - run: node tests/start-page-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plaud-page-browser-review
          path: tmp/plaud-browser/
          retention-days: 7
