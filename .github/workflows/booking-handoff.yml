name: Verify direct SimplePractice scheduling
on:
  push:
    branches: ['fix/direct-scheduling-20261014', main]
    paths:
      - 'src/booking-core.js'
      - 'src/booking-build.js'
      - 'src/assets/mft-booking.js'
      - 'scripts/prepare-booking.js'
      - 'tests/booking-handoff*'
      - 'tests/booking-direct*'
      - '.github/workflows/booking-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify same-tab scheduling in Chromium and WebKit
        run: python tests/booking-handoff-browser.py
        env:
          MFT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.mft.care' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-handoff-verification
          path: tmp/booking-handoff/
          retention-days: 7
