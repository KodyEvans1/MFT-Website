name: Sonia profile review
on:
  pull_request:
    paths:
      - 'content/**'
      - 'src/**'
      - 'tests/sonia-profile*'
      - 'tests/fixtures/other-clinician-prose.json'
      - '.github/workflows/sonia-profile.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run verify:publication
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/sonia-profile-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonia-profile-review
          path: |
            tmp/sonia-profile/
            dist/sonia-hassan-bio/
            reports/SONIA-PROFILE-REVIEW.md
          retention-days: 7
