name: Inspect Sonia profile source
on:
  push:
    branches: ['review/sonia-profile-sync-20261014']
    paths: ['.github/workflows/sonia-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only the public profile pages
        run: |
          mkdir -p tmp/sonia-source
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hidden=0; self.parts=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.hidden+=1
                  if tag=='a': self.links.append(dict(attrs))
              def handle_endtag(self,tag):
                  if tag in ('script','style'): self.hidden=max(0,self.hidden-1)
              def handle_data(self,data):
                  if not self.hidden and data.strip(): self.parts.append(data.strip())
          out=Path('tmp/sonia-source'); results=[]
          for slug in ['sonia-hassan-bio','new-page-47']:
              url='https://www.mft.care/'+slug
              try:
                  with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=30) as r:
                      html=r.read().decode(); result={'requested':url,'status':r.status,'finalUrl':r.geturl()}
                  (out/(slug+'.html')).write_text(html)
                  t=Text();t.feed(html);result['text']='\n'.join(t.parts);result['links']=t.links
              except Exception as error:
                  result={'requested':url,'error':str(error)}
              results.append(result)
          (out/'result.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonia-source
          path: tmp/sonia-source/
          retention-days: 7
