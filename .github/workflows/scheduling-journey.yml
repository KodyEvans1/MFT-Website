name: Scheduling journey verification
on:
  push:
    branches: ['review/scheduling-journey-20261025', main]
    paths:
      - 'src/start-page.js'
      - 'src/enhance.js'
      - 'src/homepage-refresh.js'
      - 'src/assets/start-page.css'
      - 'src/assets/mft-booking.js'
      - 'content/homepage.json'
      - 'content/reference-pages/individual.json'
      - 'content/service-guides/marriage-and-couples-therapy-counseling.json'
      - 'tests/scheduling-journey*'
      - '.github/workflows/scheduling-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Read-only browser and SimplePractice navigation checks
        run: python tests/scheduling-journey-browser.py
        env:
          MFT_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.mft.care' || '' }}
          MFT_VERIFY_SCHEDULER: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-journey-verification
          path: tmp/scheduling-journey/
          retention-days: 14
