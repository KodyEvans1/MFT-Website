name: Teen appointment acceptance
on:
  pull_request:
    paths:
      - 'src/teen-appointments.js'
      - 'src/assets/teen-appointments.css'
      - 'content/teen-appointment-review.json'
      - 'src/booking-build.js'
      - 'src/seo-expansion.js'
      - 'scripts/validate-booking.js'
      - 'tests/teen-appointments*'
      - '.github/workflows/teen-appointments.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test exact PR head
        run: npm run check
      - name: Install browser driver
        run: python -m pip install playwright==1.57.0
      - name: Select runner Chrome without downloading a second browser
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "MFT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "MFT_CHROMIUM=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Local HTTP layout, keyboard, consultation and synthetic consent tests
        id: local
        run: python tests/teen-appointments-browser.py
        env:
          MFT_TEEN_MODE: local
      - name: Built candidate to real public SimplePractice routes
        run: python tests/teen-appointments-browser.py
        env:
          MFT_TEEN_MODE: handoff
      - name: Hosted preview verification without changing protection
        if: always() && steps.local.outcome == 'success'
        run: python tests/teen-appointments-browser.py
        env:
          MFT_TEEN_MODE: hosted
          MFT_BASE_URL: https://deploy-preview-15--marriagefamilytherapy.netlify.app
          MFT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Upload separated evidence (no appointments, accounts or private data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-appointment-acceptance
          path: tmp/teen-appointments/
          retention-days: 7
          if-no-files-found: warn
