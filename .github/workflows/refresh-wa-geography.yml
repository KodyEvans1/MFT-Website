name: Refresh Washington geography snapshot

on:
  push:
    branches:
      - review/site-experience-seo-20260930
    paths:
      - scripts/import-wa-geographies.js
      - .github/workflows/refresh-wa-geography.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/site-experience-seo-20260930
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh official Washington place data
        run: npm run geo:refresh
      - name: Validate expanded build
        shell: bash
        run: |
          set +e
          npm run check > /tmp/mft-check.log 2>&1
          code=$?
          tail -n 220 /tmp/mft-check.log
          exit $code
      - name: Commit refreshed geography snapshot
        shell: bash
        run: |
          if git diff --quiet -- content/wa-geography.json; then
            echo "Geography snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/wa-geography.json
          git commit -m "Refresh Washington Census geography snapshot"
          git push origin HEAD:review/site-experience-seo-20260930
