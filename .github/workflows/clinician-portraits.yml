name: Clinician portrait and identity review
on:
  push:
    branches: ['review/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm install -g agent-browser@0.38.2
      - run: agent-browser install --with-deps
      - run: node tests/clinician-portraits-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinician-portraits
          path: tmp/clinician-portraits/
          retention-days: 7
