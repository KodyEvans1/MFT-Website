name: Verify isolated scheduling handoff
on:
  push:
    branches: ['fix/direct-scheduling-20261014', main]
    paths:
      - 'src/booking-core.js'
      - 'src/booking-build.js'
      - 'src/assets/mft-booking.js'
      - 'scripts/prepare-booking.js'
      - 'tests/booking-handoff*'
      - 'tests/booking-direct*'
      - '.github/workflows/booking-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    # Playwright 1.57 browser dependencies support Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    # Chromium + WebKit dependencies must finish before the isolated test runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run verify:publication
      - name: Build candidate with the production consent and scheduling configuration
        run: npm run build
        env:
          CONTEXT: production
          SITE_INDEXING_ENABLED: 'true'
          GA4_BASIC_MEASUREMENT_ENABLED: 'false'
          OPS_HANDOFF_COLLECTION_ENABLED: 'true'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify same-tab destinations in Chromium and WebKit with the scheduler intercepted
        run: python tests/booking-handoff-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-handoff-verification
          path: tmp/booking-handoff/
          retention-days: 7
